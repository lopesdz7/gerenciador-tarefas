services:
  postgres:
    image: postgres:17-alpine
    container_name: gerenciador-tarefas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gerenciador_tarefas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: gerenciador-tarefas-api
    profiles: ['app'] # sobe só com: docker compose --profile app up
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gerenciador_tarefas?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo}
      JWT_EXPIRES_IN: 1d
    ports:
      - '3333:3333'

volumes:
  pgdata:
