# Blueprint do Render: cria o banco PostgreSQL e a API de uma vez.
# No Render: New + > Blueprint > selecione este repositório.
databases:
  - name: gerenciador-tarefas-db
    plan: free
    databaseName: gerenciador_tarefas
    user: gerenciador

services:
  - type: web
    name: gerenciador-tarefas-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: gerenciador-tarefas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
